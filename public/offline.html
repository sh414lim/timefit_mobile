<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3182F6"><title>오프라인 · TimeFit</title><style>*{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;margin:0;padding:28px;background:#f5f7fa;color:#191f28;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}.card{max-width:390px;padding:34px 26px;border:1px solid #e5e8eb;border-radius:26px;background:#fff;box-shadow:0 18px 50px #191f2814}.symbol{display:grid;place-items:center;width:72px;height:72px;margin:0 auto;border-radius:24px;background:#eaf3ff;color:#3182f6;font-size:34px;font-weight:900}h1{margin:20px 0 10px;font-size:26px;letter-spacing:-1px}p{margin:0;color:#6b7684;font-size:14px;line-height:1.65}button{width:100%;min-height:50px;margin-top:22px;border:0;border-radius:15px;background:#3182f6;color:#fff;font-weight:800;cursor:pointer}</style></head><body><main class="card"><span class="symbol" aria-hidden="true">↻</span><h1>인터넷 연결을 확인해 주세요</h1><p>출퇴근·승인·제출은 연결된 상태에서만 안전하게 처리할 수 있어요.</p><button type="button" onclick="location.reload()">다시 시도</button></main></body></html>
